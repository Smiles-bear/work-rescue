name: Native recovery tests
on: [push, pull_request, workflow_dispatch]
jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel, ubuntu-22.04, ubuntu-24.04]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.28
      - run: uv sync --locked --extra dev
      - run: python scripts/bootstrap_restic.py
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

