[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "work-rescue"
version = "0.1.0a1"
description = "Local-first, cross-platform work checkpoints and verified recovery in your terminal"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["textual>=6,<9", "platformdirs>=4,<5", "pathspec>=0.12,<2", "filelock>=3.18,<4", "keyring>=25.6,<27"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[project.scripts]
work-rescue = "work_rescue.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/work_rescue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

